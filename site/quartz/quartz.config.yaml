# Other Memory -- Quartz site configuration (journey-site#5).
#
# This file is NOT read in place. site/quartz/build.sh fetches upstream Quartz at a pinned
# commit, overlays this file as its quartz.config.yaml, and builds content/ into public/.
# Nothing else from upstream is committed here: the repo stays generator-neutral markdown
# plus this config, and a Quartz upgrade is a one-line SHA bump in build.sh, reviewed like
# any other change. Derived from upstream's quartz.config.default.yaml at that commit;
# `diff` against it after a bump to see what upstream changed.
#
# Every @quartz-community/* plugin below is an npm package pinned by upstream's own
# package-lock.json, so there is no quartz.lock.json here -- `plugin install` is a no-op. The
# one `./site-plugins/*` entry is this repo's own (site/quartz/plugins/), overlaid and built by
# build.sh.
#
# Readers' browsers still fetch three libraries from public CDNs at runtime (graph: d3 +
# pixi from jsdelivr; mermaid from cdnjs, only on pages with a diagram). Tracked separately;
# self-hosting them is what unlocks a `script-src 'self'` CSP in site/quartz/nginx.conf.
# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: Other Memory
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics: null
  locale: en-US
  baseUrl: othermemory.sardaukar.work # PLACEHOLDER -- the public hostname is decided under journey-site#7; RSS/sitemap/OG need the real one
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: local # no Google CDN preconnect; the fonts plugin below self-hosts at build time
    cdnCaching: false
    typography:
      header: Schibsted Grotesk
      body: Source Sans Pro
      code: IBM Plex Mono
    colors:
      lightMode:
        light: "#faf8f8"
        lightgray: "#e5e5e5"
        gray: "#b8b8b8"
        darkgray: "#4e4e4e"
        dark: "#2b2b2b"
        secondary: "#284b63"
        tertiary: "#84a59d"
        highlight: rgba(143, 159, 169, 0.15)
        textHighlight: "#fff23688"
      darkMode:
        light: "#161618"
        lightgray: "#393639"
        gray: "#646464"
        darkgray: "#d4d4d4"
        dark: "#ebebec"
        secondary: "#7b97aa"
        tertiary: "#84a59d"
        highlight: rgba(143, 159, 169, 0.15)
        textHighlight: "#b3aa0288"
plugins:
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 30
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      # D12 (2026-09-17): the published pages are written in the portable subset -- relative .md links,
      # not Obsidian's shortest-path form. `shortest` turns ../../colophon.md into ../.././../colophon
      # (measured: five broken cross-folder links). scripts/portable.py --lint enforces the subset.
      markdownLinkResolution: relative
    order: 60
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: false
    options:
      renderEngine: katex
    order: 80
  - source: "@quartz-community/citations"
    enabled: false
    order: 85
  - source: "@quartz-community/hard-line-breaks"
    enabled: false
    order: 90
  - source: "@quartz-community/ox-hugo"
    enabled: false
    order: 91
  - source: "@quartz-community/roam"
    enabled: false
    order: 92
  - source: "@quartz-community/quartz-fonts"
    enabled: true
    options:
      fontOrigin: selfHosted
  - source: "@quartz-themes/core"
    enabled: false
    options:
      theme: tokyo-night
      mode: both
  - source: "@quartz-community/remove-draft"
    enabled: true
  - source: "@quartz-community/explicit-publish"
    enabled: false
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
      includeEmptyFiles: false # keep tag/folder stubs out of the feed and index
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/og-image"
    enabled: true
  - source: "@quartz-community/cname"
    enabled: false
  - source: "@quartz-community/canvas-page"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: true
  - source: "@quartz-community/explorer"
    enabled: true
    layout:
      position: left
      priority: 50
  - source: "@quartz-community/graph"
    enabled: true
    layout:
      position: right
      priority: 10
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: "@quartz-community/backlinks"
    enabled: true
    layout:
      position: right
      priority: 50
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: "@quartz-community/content-meta"
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  # Local plugin (site/quartz/plugins/disclosure, overlaid into the checkout by build.sh as
  # site-plugins/ -- the path below is relative to the Quartz root at build time). The transformer
  # appends `disclosure` to every page's feed item, og:description and meta description (the
  # page's own summary first); the social card draws `lead` as its own line (the card layout is
  # set from site/quartz/quartz.ts, a function no YAML can carry) -- journey-site#20; the Byline
  # component is #21. `disclosure` is the colophon's "short version" callout, verbatim minus
  # markup: the build FAILS if the two ever disagree, and if `lead` is not a prefix of it.
  - source: ./site-plugins/disclosure
    enabled: true
    options:
      disclosure: "This is a real homelab owned by a human called Joe. The writing is done by AI assistants working from his operational notes, and the byline — Nagatha — is an AI persona, not a person. The machines are named from Dune, the assistants from Expeditionary Force. Nothing here is fiction; some things are left out on purpose."
      lead: "This is a real homelab owned by a human called Joe. The writing is done by AI assistants working from his operational notes, and the byline — Nagatha — is an AI persona, not a person."
      colophonSlug: colophon
      role: an AI chronicler
      linkText: what that means
    order: 75 # after @quartz-community/description (70), which derives the text this appends to
    layout:
      position: beforeBody
      priority: 25
  - source: "@quartz-community/tag-list"
    enabled: false
    layout:
      position: beforeBody
      priority: 30
  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: left
      priority: 10
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: "@quartz-community/reader-mode"
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: "@quartz-community/breadcrumbs"
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: "@quartz-community/comments"
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  - source: "@quartz-community/footer"
    enabled: true
    options:
      links:
        Colophon: /colophon
    layout:
      position: footer
      priority: 50
  - source: "@quartz-community/recent-notes"
    enabled: false
  - source: "@quartz-community/spacer"
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: "@quartz-community/bases-page"
    enabled: true
    options: {}
    order: 50
  - source: "@quartz-community/note-properties"
    # This plugin is the FRONTMATTER PARSER (order 5) as well as the properties box. Disabled, every
    # page builds as "Untitled" with an empty content index and nothing says why (measured
    # 2026-09-17, journey-site#6). To lose the box, set hidePropertiesView: true -- never enabled: false.
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: false
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source: "@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45
  - source: "@quartz-community/encrypted-pages"
    enabled: false
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
    order: 900
  - source: "@quartz-community/stacked-pages"
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
        - disclosure # a generated listing has no author line
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
        - disclosure
      positions:
        right: []
    canvas: {}
    bases: {}
