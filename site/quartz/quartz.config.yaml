# Other Memory -- Quartz site configuration (journey-site#5).
#
# This file is NOT read in place. site/quartz/build.sh fetches upstream Quartz at a pinned
# commit, overlays this file as its quartz.config.yaml, and builds content/ into public/.
# Nothing else from upstream is committed here: the repo stays generator-neutral markdown
# plus this config, and a Quartz upgrade is a one-line SHA bump in build.sh, reviewed like
# any other change. Derived from upstream's quartz.config.default.yaml at that commit;
# `diff` against it after a bump to see what upstream changed.
#
# Every @quartz-community/* plugin below is an npm package pinned by upstream's own
# package-lock.json, so there is no quartz.lock.json here -- `plugin install` is a no-op. The
# one `./site-plugins/*` entry is this repo's own (site/quartz/plugins/), overlaid and built by
# build.sh.
#
# Readers' browsers still fetch three libraries from public CDNs at runtime (graph: d3 +
# pixi from jsdelivr; mermaid from cdnjs, only on pages with a diagram). Tracked separately;
# self-hosting them is what unlocks a `script-src 'self'` CSP in site/quartz/nginx.conf.
# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: Other Memory
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics: null
  locale: en-US
  baseUrl: othermemory.sardaukar.work # the public hostname (journey-site#7, live since 2026-09-16 via Cloudflare Pages, infra-iac#168); RSS/sitemap/OG are built against it
  # `awakening`: the chronicle is Awakening's (site/starlight, journey-site#50); the garden links to
  # it, never renders it. `icon.png`: this list is also what the core Static emitter honours when
  # it copies upstream's quartz/static/ into the output, and emitters run in parallel -- keeping
  # upstream's icon.png out of that copy is what makes the identity plugin's own static/icon.png
  # (site/quartz/plugins/favicon/assets, its emitter) the only one written. Bare entries only --
  # check-emitted.py reads this block line by line and stops at the first line that is not one.
  ignorePatterns:
    - private
    - templates
    - .obsidian
    - awakening
    - icon.png
  theme:
    fontOrigin: local # no Google CDN preconnect; the fonts plugin below self-hosts at build time
    cdnCaching: false
    # Identity (dutchman, 2026-09-17). One family, three voices: the serif for what is said, the
    # sans for reading it, the mono for what the machine set around it (dates, byline, breadcrumbs,
    # the tree). Plex was drawn around "the relationship between mankind and machine" -- apt here,
    # and left unexplained on the page. Rhythm, scale and the front door are in
    # site/quartz/plugins/identity; this block is only what Quartz turns into CSS variables.
    typography:
      header: IBM Plex Serif
      body: IBM Plex Sans
      code: IBM Plex Mono
    # Subdued Dune, on purpose: the house is named from the books, the palette says so to anyone
    # who knows them and reads as warm paper / ink to anyone who does not. Light is sand and ink
    # with a burnt-spice accent; dark is the blue within blue -- an indigo ground, bone text, spice
    # gold for links. No ornament anywhere. Body text and links clear 4.5:1 in both modes.
    colors:
      lightMode:
        light: "#ede5d3" # sand
        lightgray: "#d9cfb9" # rules, borders
        gray: "#6a6050" # metadata, the mono margin -- 4.9:1 on the sand (was #8a806e at 3.1, under AA; measured 2026-09-18)
        darkgray: "#3f3830" # body text
        dark: "#221d18" # headings, the author's name
        secondary: "#8a4b1a" # burnt spice: links, the site title, tips
        tertiary: "#3b5b7a" # Ibad blue: hover, notes, focus ring, the graph
        highlight: rgba(138, 75, 26, 0.10)
        textHighlight: "#e8c46a88"
      darkMode:
        light: "#14181f" # blue within blue: the ground is indigo, not black
        lightgray: "#262d38"
        gray: "#7d8797"
        darkgray: "#c9c2b4" # bone
        dark: "#efe8d8"
        secondary: "#d9a35a" # spice gold
        tertiary: "#7f9fbf" # Ibad blue
        highlight: rgba(217, 163, 90, 0.10)
        textHighlight: "#d9a35a55"
plugins:
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 30
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      # D12 (2026-09-17): the published pages are written in the portable subset -- relative .md links,
      # not Obsidian's shortest-path form. `shortest` turns ../../colophon.md into ../.././../colophon
      # (measured: five broken cross-folder links). scripts/portable.py --lint enforces the subset.
      markdownLinkResolution: relative
    order: 60
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: false
    options:
      renderEngine: katex
    order: 80
  - source: "@quartz-community/citations"
    enabled: false
    order: 85
  - source: "@quartz-community/hard-line-breaks"
    enabled: false
    order: 90
  - source: "@quartz-community/ox-hugo"
    enabled: false
    order: 91
  - source: "@quartz-community/roam"
    enabled: false
    order: 92
  - source: "@quartz-community/quartz-fonts"
    enabled: true
    options:
      fontOrigin: selfHosted
      # This plugin fetches by ITS options, not theme.typography above (measured 2026-09-17: with
      # only fontOrigin set it self-hosted Quartz's defaults while --headerFont pointed at Plex).
      # Both places name the same three families on purpose; the weights are the ones the
      # identity stylesheet actually uses.
      header:
        name: IBM Plex Serif
        weights: [400, 500, 600]
        includeItalic: true
      body:
        name: IBM Plex Sans
        weights: [400, 600]
        includeItalic: true
      code:
        name: IBM Plex Mono
        weights: [400, 600]
  - source: "@quartz-themes/core"
    enabled: false
    options:
      theme: tokyo-night
      mode: both
  - source: "@quartz-community/remove-draft"
    enabled: true
  - source: "@quartz-community/explicit-publish"
    enabled: false
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
      includeEmptyFiles: false # keep tag/folder stubs out of the feed and index
  - source: "@quartz-community/favicon"
    # Off: it reads upstream's quartz/static/icon.png straight from the checkout and would write a
    # favicon.ico of the stock Quartz mark. The local favicon plugin below writes favicon.ico from
    # the garden's own mark instead (2026-09-18).
    enabled: false
  - source: "@quartz-community/og-image"
    enabled: true
  - source: "@quartz-community/cname"
    enabled: false
  - source: "@quartz-community/canvas-page"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: true
  - source: "@quartz-community/explorer"
    # Off (journey-site#95). Its tree is built in the browser -- one voice, one level, no axis to
    # group by, and its reshaping options go through new Function(), which the CSP forbids. The
    # local contents plugin below renders the garden's table of contents at build time instead.
    enabled: false
    layout:
      position: left
      priority: 50
  # Local plugin (site/quartz/plugins/contents): the garden's table of contents -- the descriptor
  # pinned, then every page under its `topic:` from the closed list the plugin and
  # docs/tray-brief.md both carry; a page with no topic or an unknown one FAILS the build, naming
  # the file (journey-site#95).
  - source: ./site-plugins/contents
    enabled: true
    order: 97
    layout:
      position: left
      priority: 50
  - source: "@quartz-community/graph"
    enabled: true
    layout:
      position: right
      priority: 10
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: "@quartz-community/backlinks"
    enabled: true
    layout:
      position: right
      priority: 50
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: "@quartz-community/content-meta"
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  # Local plugin (site/quartz/plugins/disclosure, overlaid into the checkout by build.sh as
  # site-plugins/ -- the path below is relative to the Quartz root at build time). The transformer
  # appends `disclosure` to every page's feed item, og:description and meta description (the
  # page's own summary first); the social card draws `lead` as its own line (the card layout is
  # set from site/quartz/quartz.ts, a function no YAML can carry) -- journey-site#20; the Byline
  # component is #21. `disclosure` is the colophon's "short version" callout, verbatim minus
  # markup: the build FAILS if the two ever disagree, and if `lead` is not a prefix of it.
  - source: ./site-plugins/disclosure
    enabled: true
    options:
      disclosure: "This is a real homelab owned by a human called Joe. The writing is done by AI assistants working from his operational notes, and the byline — Nagatha — is an AI persona, not a person. The machines are named from Dune, the assistants from Expeditionary Force. Nothing here is fiction; some things are left out on purpose."
      lead: "This is a real homelab owned by a human called Joe. The writing is done by AI assistants working from his operational notes, and the byline — Nagatha — is an AI persona, not a person."
      colophonSlug: colophon
      role: an AI chronicler
      linkText: what that means
    order: 75 # after @quartz-community/description (70), which derives the text this appends to
    layout:
      position: beforeBody
      priority: 25
  # Local plugin (site/quartz/plugins/identity): the garden's stylesheet, delivered as a plugin
  # resource -- static/resource-style-<hash>.css, unlayered, on every page, the same path
  # @quartz-themes/core uses. It transforms nothing; it is the one place real CSS can ship without a
  # new overlay in build.sh. The palette and fonts above are what it builds on.
  - source: ./site-plugins/identity
    enabled: true
    order: 95
    layout:
      # The NotFound component. The 404 renders in the "minimal" frame, which draws only the fixed
      # body and the footer slot, so the designed 404 lives in the footer slot, ahead of the stock
      # footer (50), and returns nothing on every other page (see the plugin).
      position: footer
      priority: 10
  # Local plugin (site/quartz/plugins/favicon): the garden's own favicon, written by an emitter to
  # static/icon.png, favicon.ico and static/favicon.svg. Its own plugin, not part of identity: the
  # loader instantiates a multi-category plugin once per category and collects externalResources()
  # from every instance, which emitted the stylesheet link twice (measured 2026-09-18).
  - source: ./site-plugins/favicon
    enabled: true
    order: 96
  - source: "@quartz-community/tag-list"
    enabled: false
    layout:
      position: beforeBody
      priority: 30
  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: left
      priority: 10
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: "@quartz-community/reader-mode"
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: "@quartz-community/breadcrumbs"
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: "@quartz-community/comments"
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  - source: "@quartz-community/footer"
    enabled: true
    options:
      links:
        Colophon: /colophon
    layout:
      position: footer
      priority: 50
  - source: "@quartz-community/recent-notes"
    enabled: false
  - source: "@quartz-community/spacer"
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: "@quartz-community/bases-page"
    enabled: true
    options: {}
    order: 50
  - source: "@quartz-community/note-properties"
    # This plugin is the FRONTMATTER PARSER (order 5) as well as the properties box. Disabled, every
    # page builds as "Untitled" with an empty content index and nothing says why (measured
    # 2026-09-17, journey-site#6). To lose the box, set hidePropertiesView: true -- never enabled: false.
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: false
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source: "@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45
  - source: "@quartz-community/encrypted-pages"
    enabled: false
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
    order: 900
  - source: "@quartz-community/stacked-pages"
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
        - disclosure # a generated listing has no author line
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
        - disclosure
      positions:
        right: []
    canvas: {}
    bases: {}
